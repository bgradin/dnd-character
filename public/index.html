<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="./dragon-head.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#c9d9c7" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&amp;display=swap" />
    <style>
      html, body { margin: 0; background: #c9d9c7; color: #171b17; }
      .startup-loader { min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center; }
      .startup-loader__content { width: min(320px, 80vw); text-align: center; }
      .startup-loader h1 { margin: 0 0 24px; font: 600 32px/1.25 Cinzel, Georgia, serif; visibility: hidden; }
      .startup-font-ready .startup-loader h1 { visibility: visible; }
      .startup-font-fallback .startup-loader h1 { font-family: Georgia, serif; visibility: visible; }
      .startup-loader progress { display: block; width: 100%; height: 12px; accent-color: #356e42; }
      #startup-error { color: #b00020; font: 16px/1.5 sans-serif; overflow-wrap: anywhere; }
    </style>
    <script>
      if (document.fonts) {
        document.fonts.load('600 32px Cinzel').then(function (fonts) {
          document.documentElement.classList.add(fonts.length ? 'startup-font-ready' : 'startup-font-fallback');
        }, function () {
          document.documentElement.classList.add('startup-font-fallback');
        });
      } else {
        document.documentElement.classList.add('startup-font-fallback');
      }
    </script>
    <title>DND Character Sheet</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
      <main class="startup-loader" aria-labelledby="startup-heading">
        <div class="startup-loader__content">
          <h1 id="startup-heading">Loading</h1>
          <progress id="startup-progress" max="1" value="0" aria-label="Loading progress"></progress>
          <p id="startup-error" role="alert" hidden></p>
        </div>
      </main>
    </div>
    <script src="./assets/bundle.js"></script>
  </body>
</html>
